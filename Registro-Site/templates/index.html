<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Jogadores</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/index.css') }}">
</head>
<body>
    {% include "_menu.html" %}
    <h1>Jogadores</h1>
    <div class="lista">
        {% for jogador in jogadores %}
        <div class="card">
            <a class="foto" href="{{ url_for('perfil', usuario=jogador.usuario) }}">
                {% if jogador.avatar %}
                <img src="{{ url_for('midia', usuario=jogador.usuario, arquivo=jogador.avatar, v=jogador.atualizado) }}" alt="">
                {% else %}{{ jogador.nome[0]|upper }}{% endif %}
            </a>
            <div class="texto">
                <h3><a href="{{ url_for('perfil', usuario=jogador.usuario) }}">{{ jogador.nome }}</a></h3>
                <p>{{ jogador.descricao }}</p>
            </div>
        </div>
        {% else %}
        <p>Nenhum jogador registrado ainda.</p>
        {% endfor %}
    </div>
</body>
</html>
